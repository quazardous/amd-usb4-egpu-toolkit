# Drop-in override for nvidia-persistenced.service that makes it eGPU-aware.
#
# Problem: nvidia-persistenced is shipped as a system-wide daemon expected to
# run permanently — it starts at boot and fails noisily if no GPU is there.
# On a laptop with an eGPU, the GPU isn't on the bus at boot. Without this
# drop-in:
#   - boot tries to start the service 5 times in a row
#   - each one fails with "Failed to query NVIDIA devices"
#   - systemd hits StartLimitBurst and gives up: "Start request repeated too
#     quickly"
#   - manual `systemctl reset-failed` is needed before any later attempt
#
# Fix: skip the service cleanly when no GPU is bound to the nvidia driver
# (boot path), and let the udev rule in udev/99-nvidia-egpu-persistenced.rules
# trigger the start/stop as the driver binds to / unbinds from the eGPU.
#
# Install destination: /etc/systemd/system/nvidia-persistenced.service.d/override.conf

[Unit]
# A GPU bound to the nvidia driver, rather than /dev/nvidia0: some packagings
# (Fedora / RPM Fusion) only create the device nodes on first userspace
# access, so /dev/nvidia0 is missing right after a hot-plug and a condition
# on it never holds when udev starts the service.
ConditionPathExistsGlob=/sys/bus/pci/drivers/nvidia/0000:*

[Service]
# Create /dev/nvidia0, /dev/nvidiactl and /dev/nvidia-uvm* before the daemon
# opens them. Harmless where udev or the packaging already created them.
ExecStartPre=/usr/bin/nvidia-modprobe -c 0 -u
# udev handles re-starts on plug events; auto-restart on failure would just
# loop pointlessly when the GPU isn't there.
Restart=no
